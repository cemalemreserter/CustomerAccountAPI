server.port= 9000
spring.application.name= MsCustomerAccountApplication
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=topic-transaction
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.customer.serialization.JsonPOJODeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.customer.serialization.JsonPOJOSerializer
spring.main.allow-circular-references= true
spring.data.redis.host= localhost
spring.data.redis.port= 6379