<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Customer Details</h2>
  <form id="customerForm">
    <div class="mb-3">
      <label for="customerId" class="form-label">Customer ID:</label>
      <input type="text" class="form-control" id="customerId" required>
    </div>
    <button type="button" class="btn btn-primary" onclick="fetchCustomerDetails()">Get Details</button>
  </form>

  <div class="mt-4" id="customerDetails" style="display: none;">
    <h4>Customer Information:</h4>
    <p><strong>Name:</strong> <span id="customerName"></span></p>
    <p><strong>Email:</strong> <span id="customerEmail"></span></p>
    <p><strong>Accounts:</strong> <span id="customerAccounts"></span></p>
  </div>
</div>

<script>
  function fetchCustomerDetails() {
      const customerId = document.getElementById("customerId").value;

      fetch("/customers/" + customerId)
      .then(response => {
          if (!response.ok) {
              throw new Error("Customer not found");
          }
          return response.json();
      })
      .then(data => {
          document.getElementById("customerName").innerText = data.name;
          document.getElementById("customerEmail").innerText = data.email;
          document.getElementById("customerAccounts").innerText = data.accounts.join(", ");
          document.getElementById("customerDetails").style.display = "block";
      })
      .catch(error => {
          alert(error.message);
          document.getElementById("customerDetails").style.display = "none";
      });
  }
</script>
</body>
</html>
